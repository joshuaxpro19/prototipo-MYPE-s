name: prototipo-mype

x-api-env: &api-env
  DATABASE_URL: postgresql+psycopg://mype:${POSTGRES_PASSWORD:-mype_dev_pass}@db:5432/mype
  REDIS_URL: redis://redis:6379/0
  JWT_SECRET: ${JWT_SECRET:-cambiar-en-produccion}
  ADMIN_EMAIL: ${ADMIN_EMAIL:-propietario@mype.pe}
  ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Piloto2026!}
  ADMIN_TOTP_SECRET: ${ADMIN_TOTP_SECRET:-JBSWY3DPEHPK3PXP}
  ARTIFACTS_DIR: /srv/artifacts
  ALERT_THRESHOLD: ${ALERT_THRESHOLD:-0.5}
  DEMO_MODE: ${DEMO_MODE:-1}
  MLFLOW_TRACKING_URI: http://mlflow:5000

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: mype
      POSTGRES_USER: mype
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mype_dev_pass}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mype -d mype"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "5432:5432"
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.17.2
    command: >
      mlflow server --host 0.0.0.0 --port 5000
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --default-artifact-root /mlflow/artifacts
    volumes:
      - mlflowdata:/mlflow
    ports:
      - "5000:5000"
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    environment: *api-env
    volumes:
      - ./artifacts:/srv/artifacts:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    restart: unless-stopped


  worker:
    build:
      context: .
      dockerfile: api/Dockerfile
    command: ["python", "-m", "app.worker"]
    environment:
      <<: *api-env
      SYNC_INTERVAL_MIN: "60"
    volumes:
      - ./artifacts:/srv/artifacts:ro
    depends_on:
      api:
        condition: service_started
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import os,time; assert time.time()-os.path.getmtime('/tmp/worker.alive')<7200"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    restart: unless-stopped

  frontend:
    build: ./frontend
    depends_on:
      api:
        condition: service_started
    ports:
      - "8080:80"
    restart: unless-stopped

  trainer:
    profiles: ["train"]
    image: python:3.12-slim
    working_dir: /srv
    command: >
      sh -c "pip install --no-cache-dir -r ml/requirements.txt &&
             python data/generate_demo.py --out data/demo &&
             python ml/train.py --raw data/demo --fecha 2026-11-10T09:14:00"
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
    volumes:
      - ./:/srv
    depends_on:
      - mlflow

volumes:
  pgdata:
  redisdata:
  mlflowdata:

