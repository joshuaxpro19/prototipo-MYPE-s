services:
  - type: web
    name: prototipo-mype-api
    runtime: docker
    dockerfilePath: ./deploy/Dockerfile
    dockerContext: .
    plan: free
    region: oregon
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: DEMO_MODE
        value: "1"
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        value: propietario@mype.pe
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_TOTP_SECRET
        sync: false
      - key: ALERT_THRESHOLD
        value: "0.5"

  - type: web
    name: prototipo-mype-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    autoDeploy: true
    envVars:
      - key: VITE_API_BASE
        fromService:
          type: web
          name: prototipo-mype-api
          property: host
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
